name: Deploy Marketing Site to GitHub Pages

on:
  push:
    branches: [main]
    paths: [marketing/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
        working-directory: marketing
      - run: npm run build
        working-directory: marketing
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
